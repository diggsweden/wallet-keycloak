# Artifacts Configuration for wallet-keycloak
# Defines container image publishing for Keycloak with ABCA extension

artifacts:
  - name: wallet-keycloak
    project-type: npm
    working-directory: .
    build-type: application
    config:
      node-version: 24

containers:
  - name: wallet-keycloak
    from: [wallet-keycloak]
    container-file: Containerfile
    context: .
    platforms: linux/amd64,linux/arm64
    registry: ghcr.io
