publiccodeYmlVersion: "0.4"
categories:
  - identity-management
  - security
description:
  en:
    features:
      - Keycloak Authorization Server for EU Digital Identity Wallet
      - Attestation-Based Client Authentication (ABCA / RFC draft)
      - Demonstrating Proof-of-Possession (DPoP) support
      - Pre-configured PID Issuer and Master realms with environment parameterization
    longDescription: |
      Custom Keycloak container image for the Digg EU Digital Identity Wallet
      ecosystem. Packages Keycloak with the European Commission's ABCA extension
      (eu.europa.ec.eudi:abca-keycloak-ext) to support Wallet Instance Attestation
      validation, client registration, and credential issuance authorization flows.
    shortDescription: Keycloak container image with ABCA extension for EUDIW PID Issuance.
